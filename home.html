<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidiaVille Currency Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col">
  <main class="flex-1 flex items-center justify-center px-4">
    <div class="text-center max-w-2xl">
      <p class="text-brand-500 font-semibold tracking-widest uppercase text-sm mb-4">

        Balances, companies, gigs &amp; tax reports — all in one place.<br>
        For the players who keep the city running.
      </p>
      <a href="{{ url_for('login') }}"
         class="inline-block bg-brand-600 hover:bg-brand-500 text-white font-medium px-8 py-3.5 rounded-xl transition shadow-lg shadow-brand-900/30">
        Sign in
      </a>
    </div>
  </main>

  <footer class="py-6 text-center text-slate-600 text-sm">
    VidiaVille · Internal use only
  </footer>

</html>
